<!DOCTYPE html>
<html>

<head>
  <title>Калькулятор услуг для самозанятых</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <a href="https://github.com/ShanurinaKatya/Shanurina-PNA-Labs-2026/tree/Calculator-JavaScript" class = "details git-service">Git</a>

  <div class = "service-background">
  <div class="service-calculator">

    <div id="total-result" class="total-amount">
      0
    </div>

    <button id="theme-toggle" class="details theme-btn"> Сменить тему</button>

    <!-- Блок с выбором услуг и действий -->
    <div>

      <div>
        <button id="action_clear" class="service-btn secondary-action">C</button>
        <button id="action_sign" class="service-btn secondary-action">+/-</button>
        <button id="action_percent" class="service-btn secondary-action">%</button>
        <button id="service_divide" class="service-btn primary-action">/</button>
      </div>

      <div>
        <button id="service_7" class="service-btn">7</button>
        <button id="service_8" class="service-btn">8</button>
        <button id="service_9" class="service-btn">9</button>
        <button id="service_multiply" class="service-btn primary-action">x</button>
      </div>

      <div>
        <button id="service_4" class="service-btn">4</button>
        <button id="service_5" class="service-btn">5</button>
        <button id="service_6" class="service-btn">6</button>
        <button id="service_minus" class="service-btn primary-action">-</button>
      </div>

      <div>
        <button id="service_1" class="service-btn">1</button>
        <button id="service_2" class="service-btn">2</button>
        <button id="service_3" class="service-btn">3</button>
        <button id="service_plus" class="service-btn primary-action">+</button>
      </div>

      <div>
        <button id="service_0" class="service-btn">0</button>
        <button id="service_dot" class="service-btn">.</button>
        <button id="service_calculate" class="service-btn primary-action execute-action">=</button>
      </div>
    </div>
  </div>

  <div class="service-signature">
      ЛР выполнена Шануриной Е.С.
    </div>
  </div>

  <div class = "details author">Автор</div>
  <div class = "details fio">Шанурина Е.С. ИУ5-41Б</div>

</body>
</html>
